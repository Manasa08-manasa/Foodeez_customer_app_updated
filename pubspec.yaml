name: foodeez
description: "Foodeez — MVC architecture with Riverpod state management."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  shared_preferences: ^2.2.3
  geolocator: ^14.0.3
  google_maps_flutter: ^2.17.1
  razorpay_flutter: ^1.4.0
  socket_io_client: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/foodeez-mark.png
    - assets/images/foodeez-f-logo.png
    - assets/images/foodeez-logo-stack.png
    - assets/images/logo_customer.png
    - assets/images/foodeez_customer_logo.png
    - assets/images/Foodeez_logo_1.png


  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  macos:
    generate: true
  web:
    generate: true
  image_path: assets/images/logo_customer.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo_customer.png
  adaptive_icon_foreground_inset: 18

flutter_native_splash:
  color: "#2A0E1C"
  image: assets/images/foodeez-f-logo.png
  android_12:
    color: "#2A0E1C"
    image: assets/images/foodeez-f-logo.png
  android: true
  ios: false
  web: false
